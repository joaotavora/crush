name: build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Build Linux x86_64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v .
        
      - name: Run tests
        run: go test -v ./...
